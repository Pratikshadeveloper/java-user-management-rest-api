# ==============================================================================
# Spring Boot User Management REST API Configuration
# ==============================================================================

# Server Configuration (Port 8081 avoids conflict with existing Oracle XE service on port 8080)
server.port=8081

# Application Name
spring.application.name=user-management-api

# ------------------------------------------------------------------------------
# Active Profile: H2 In-Memory Database (Default for zero-setup execution)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

